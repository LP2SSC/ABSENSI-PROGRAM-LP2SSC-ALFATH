<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABSENSI MULTI-KELAS — LP2SSC</title>
<style>
* ,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb;margin:0;padding:0}
html,body,#root{min-height:100%;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}
input:focus,select:focus{outline:none;box-shadow:none}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.history-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;border:1px solid rgba(0,0,0,.12);vertical-align:middle}
.history-dots{display:flex;align-items:center;gap:0;margin-top:6px;flex-wrap:wrap}
.history-dots-label{font-size:9px;font-weight:700;letter-spacing:.06em;color:rgba(0,0,0,.3);margin-right:6px}
@keyframes popBadge{0%{transform:scale(.85);opacity:.4}55%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes cardPulse{0%{box-shadow:0 8px 30px rgba(0,0,0,.04)}50%{box-shadow:0 12px 40px rgba(0,0,0,.15)}100%{box-shadow:0 8px 30px rgba(0,0,0,.04)}}
.status-chip-pop{animation:popBadge .34s cubic-bezier(.34,1.56,.64,1)}
.card-pulse{animation:cardPulse .5s ease}
</style>

<style id="skin-engine-css">
/* ============================================================
   SKIN ENGINE — LAPISAN TEMA TAMPILAN
   Dipilih admin, otomatis diikuti tampilan siswa.
   Tema "default" = tampilan asli (tanpa perubahan apa pun).
   ============================================================ */

/* ---------- panel admin (dipakai semua tema) ---------- */
html {
  --sk-panel-bg: #ffffff;
  --sk-panel-fg: #0f172a;
  --sk-panel-border: rgba(15, 23, 42, .10);
  --sk-panel-soft: #f1f5f9;
  --sk-panel-accent: #6366f1;
  --sk-panel-shadow: 0 26px 60px -20px rgba(15, 23, 42, .45);
}

.sk-admin-fab {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 330;
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  color: #fff;
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  box-shadow: 0 14px 30px -10px rgba(99, 102, 241, .75), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .18s ease, box-shadow .18s ease;
}
.sk-admin-fab:hover { transform: translateY(-3px) scale(1.03); }
.sk-admin-fab:active { transform: translateY(0) scale(.97); }

.sk-admin-panel {
  position: fixed;
  right: 16px;
  bottom: 80px;
  z-index: 331;
  width: min(372px, calc(100vw - 32px));
  max-height: min(78vh, 640px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  border-radius: 22px;
  background: var(--sk-panel-bg);
  color: var(--sk-panel-fg);
  border: 1px solid var(--sk-panel-border);
  box-shadow: var(--sk-panel-shadow);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  animation: skPanelIn .22s cubic-bezier(.2, .8, .2, 1);
}
@keyframes skPanelIn {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to { opacity: 1; transform: none; }
}

.sk-admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sk-admin-title { font-size: 15px; font-weight: 900; letter-spacing: -.01em; }
.sk-admin-sub { font-size: 11px; font-weight: 600; opacity: .6; margin-top: 3px; line-height: 1.4; }
.sk-admin-x {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft); color: inherit; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
}

.sk-admin-search {
  width: 100%;
  height: 34px;
  margin-bottom: 10px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft);
  color: inherit;
  font: inherit;
  font-size: 11.5px;
  font-weight: 700;
}
.sk-admin-search::placeholder { color: inherit; opacity: .45; }
.sk-admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sk-th {
  position: relative; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 8px; border-radius: 14px; border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft); color: inherit; font: inherit; cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.sk-th:hover { transform: translateY(-1px); border-color: var(--sk-panel-accent); }
.sk-th.active { border-color: var(--sk-panel-accent); box-shadow: 0 0 0 2px var(--sk-panel-accent) inset; }
.sk-th-swatch { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.sk-th-meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sk-th-name { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-th-desc { font-size: 9.5px; font-weight: 600; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-th-check {
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 999px;
  background: var(--sk-panel-accent); color: #fff; font-size: 10px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}

.sk-admin-sec { margin-top: 14px; }
.sk-admin-label { font-size: 10px; font-weight: 900; letter-spacing: .12em; opacity: .5; margin-bottom: 6px; }
.sk-admin-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--sk-panel-soft); }
.sk-mode {
  height: 34px; border-radius: 9px; border: none; cursor: pointer; font: inherit;
  font-size: 11.5px; font-weight: 800; color: inherit; background: transparent; opacity: .65;
}
.sk-mode.active { background: var(--sk-panel-accent); color: #fff; opacity: 1; }
.sk-admin-note {
  margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: var(--sk-panel-soft);
  font-size: 10.5px; font-weight: 600; line-height: 1.5; opacity: .85;
}
.sk-admin-note b { font-weight: 900; }

/* ============================================================
   1. DEFAULT — tampilan asli, tidak ada override
   ============================================================ */

/* ============================================================
   2. CLAYMORPHISM — empuk, pastel, seperti tanah liat
   ============================================================ */
html[data-skin="clay"] body { background: #e6ebf4 !important; }
html[data-skin="clay"] .sk-page {
  background: radial-gradient(130% 100% at 50% 0%, #f8fafd 0%, #e8edf6 45%, #dbe3f0 100%) !important;
  font-family: ui-rounded, "Nunito", "SF Pro Rounded", system-ui, -apple-system, sans-serif !important;
}
html[data-skin="clay"] .sk-panel {
  background: linear-gradient(160deg, #fbfcff, #eef2f9) !important;
  border: 1px solid rgba(255, 255, 255, .9) !important;
  box-shadow: 0 24px 48px -20px rgba(86, 110, 150, .55), 0 10px 22px -12px rgba(86, 110, 150, .35),
              inset 0 2px 0 rgba(255, 255, 255, .95), inset 0 -8px 16px rgba(148, 163, 190, .18) !important;
}
html[data-skin="clay"] .sk-surface {
  background: linear-gradient(160deg, #fdfeff, #f1f4fa) !important;
  border: 1px solid rgba(255, 255, 255, .85) !important;
  box-shadow: 0 14px 26px -16px rgba(86, 110, 150, .55), inset 0 1px 0 #fff,
              inset 0 -5px 12px rgba(148, 163, 190, .16) !important;
}
html[data-skin="clay"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .8) !important;
  box-shadow: 0 6px 12px -8px rgba(86, 110, 150, .65), inset 0 1px 0 rgba(255, 255, 255, .9) !important;
}
html[data-skin="clay"] .sk-tint { box-shadow: inset 0 2px 6px rgba(148, 163, 190, .28) !important; }
html[data-skin="clay"] .sk-field {
  background: #eef2f9 !important;
  border: 2px solid rgba(255, 255, 255, .9) !important;
  box-shadow: inset 4px 4px 10px rgba(163, 177, 198, .45), inset -4px -4px 10px rgba(255, 255, 255, .95) !important;
}
html[data-skin="clay"] .sk-btn {
  box-shadow: 0 7px 0 -3px rgba(255, 255, 255, .75), 0 12px 22px -12px rgba(86, 110, 150, .8),
              inset 0 -3px 6px rgba(0, 0, 0, .07) !important;
}
html[data-skin="clay"] .sk-btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 6px rgba(0, 0, 0, .12) !important; }
html[data-skin="clay"] .sk-overlay { background: rgba(43, 50, 69, .35) !important; backdrop-filter: blur(6px); }

/* ============================================================
   3. GLASSMORPHISM — bening, blur, gradien lembut
   ============================================================ */
html[data-skin="glass"] body { background: #eef2ff !important; }
html[data-skin="glass"] .sk-page {
  background:
    radial-gradient(45% 35% at 12% 8%, rgba(167, 139, 250, .55), transparent 70%),
    radial-gradient(40% 35% at 90% 12%, rgba(103, 232, 249, .55), transparent 70%),
    radial-gradient(45% 40% at 75% 95%, rgba(251, 207, 232, .6), transparent 72%),
    radial-gradient(40% 35% at 20% 90%, rgba(191, 219, 254, .6), transparent 70%),
    #eef2ff !important;
  background-attachment: fixed !important;
}
html[data-skin="glass"] .sk-panel {
  background: linear-gradient(160deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .44)) !important;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, .78) !important;
  box-shadow: 0 24px 60px -24px rgba(30, 41, 59, .45), inset 0 1px 0 rgba(255, 255, 255, .9) !important;
}
html[data-skin="glass"] .sk-surface {
  background: rgba(255, 255, 255, .62) !important;
  border: 1px solid rgba(255, 255, 255, .7) !important;
  box-shadow: 0 10px 26px -18px rgba(30, 41, 59, .5), inset 0 1px 0 rgba(255, 255, 255, .85) !important;
}
html[data-skin="glass"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .72) !important;
  box-shadow: 0 4px 10px -6px rgba(30, 41, 59, .5) !important;
}
html[data-skin="glass"] .sk-tint { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55) !important; }
html[data-skin="glass"] .sk-field {
  background: rgba(255, 255, 255, .68) !important;
  border: 1px solid rgba(255, 255, 255, .9) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 16px -12px rgba(30, 41, 59, .6) !important;
}
html[data-skin="glass"] .sk-btn {
  box-shadow: 0 10px 24px -14px rgba(30, 41, 59, .75), inset 0 1px 0 rgba(255, 255, 255, .55) !important;
}
html[data-skin="glass"] .sk-overlay { background: rgba(15, 23, 42, .35) !important; backdrop-filter: blur(4px); }
html[data-skin="glass"] .sk-banner { background: rgba(255, 255, 255, .62) !important; border: 1px solid rgba(255, 255, 255, .8) !important; }

/* ============================================================
   4. NEONMORPHISM — gelap, garis neon, glow
   ============================================================ */
html[data-skin="neon"] {
  color-scheme: dark;
  --sk-panel-bg: #0b1020;
  --sk-panel-fg: #e7f2ff;
  --sk-panel-border: rgba(56, 189, 248, .3);
  --sk-panel-soft: rgba(148, 233, 255, .07);
  --sk-panel-accent: #22d3ee;
}
html[data-skin="neon"] body { background: #05070f !important; }
html[data-skin="neon"] .sk-page {
  background:
    radial-gradient(60% 40% at 10% 0%, rgba(34, 211, 238, .16), transparent 65%),
    radial-gradient(55% 45% at 95% 5%, rgba(168, 85, 247, .2), transparent 65%),
    radial-gradient(60% 50% at 50% 105%, rgba(59, 130, 246, .14), transparent 65%),
    #05070f !important;
  background-attachment: fixed !important;
}
html[data-skin="neon"] .sk-panel {
  background: linear-gradient(160deg, rgba(16, 22, 40, .95), rgba(8, 11, 22, .97)) !important;
  border: 1px solid rgba(56, 189, 248, .28) !important;
  box-shadow: 0 26px 60px -26px rgba(34, 211, 238, .65), inset 0 1px 0 rgba(148, 233, 255, .08) !important;
  color: #e7f2ff !important;
}
html[data-skin="neon"] .sk-surface {
  background: linear-gradient(160deg, rgba(18, 24, 44, .92), rgba(9, 12, 24, .94)) !important;
  border: 1px solid rgba(99, 102, 241, .25) !important;
  box-shadow: 0 0 18px -6px rgba(56, 189, 248, .4), inset 0 1px 0 rgba(148, 233, 255, .06) !important;
  color: #e7f2ff !important;
}
html[data-skin="neon"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .16) !important;
  box-shadow: 0 0 12px -3px rgba(56, 189, 248, .5) !important;
}
html[data-skin="neon"] .sk-tint {
  background: linear-gradient(120deg, rgba(34, 211, 238, .14), rgba(168, 85, 247, .14)) !important;
  border: 1px solid rgba(56, 189, 248, .16) !important;
}
html[data-skin="neon"] .sk-field {
  background: rgba(6, 10, 20, .92) !important;
  border: 1px solid rgba(56, 189, 248, .35) !important;
  color: #e7f2ff !important;
  box-shadow: inset 0 0 14px rgba(34, 211, 238, .12) !important;
}
html[data-skin="neon"] .sk-field::placeholder { color: rgba(190, 214, 255, .45) !important; }
html[data-skin="neon"] .sk-btn {
  box-shadow: 0 0 20px -6px rgba(56, 189, 248, .75), inset 0 1px 0 rgba(255, 255, 255, .12) !important;
}
html[data-skin="neon"] .sk-btn-dark { background: linear-gradient(135deg, #22d3ee, #a855f7) !important; color: #04101f !important; }
html[data-skin="neon"] .sk-txt { color: #e7f2ff !important; }
/* teks di dalam elemen yang tetap terang (tombol putih, chip, badge) jangan dipaksa terang */
html[data-skin="neon"] .sk-btn .sk-txt,
html[data-skin="neon"] .sk-btn .sk-txt-muted,
html[data-skin="neon"] .sk-chip .sk-txt,
html[data-skin="neon"] .sk-chip .sk-txt-muted,
html[data-skin="neon"] .sk-accent .sk-txt,
html[data-skin="neon"] .sk-accent .sk-txt-muted,
html[data-skin="neon"] .sk-banner .sk-txt,
html[data-skin="neon"] .sk-banner .sk-txt-muted,
html[data-skin="neon"] .sk-field .sk-txt { color: inherit !important; }
html[data-skin="neon"] .sk-txt-muted { color: rgba(190, 214, 255, .62) !important; }
html[data-skin="neon"] .sk-overlay { background: rgba(2, 4, 12, .72) !important; backdrop-filter: blur(8px); }
html[data-skin="neon"] .sk-btn-soft {
  background: rgba(148, 233, 255, .08) !important;
  color: rgba(206, 230, 255, .82) !important;
  border: 1px solid rgba(56, 189, 248, .22) !important;
  box-shadow: none !important;
}
html[data-skin="neon"] .sk-banner {
  background: #eef6ff !important;
  border: 1px solid rgba(56, 189, 248, .38) !important;
  box-shadow: 0 14px 34px -22px rgba(34, 211, 238, .95) !important;
}

/* ============================================================
   5. NEUMORPHISM — monokrom, timbul & tenggelam
   ============================================================ */
html[data-skin="neo"] body { background: #e7ebf1 !important; }
html[data-skin="neo"] .sk-page { background: linear-gradient(160deg, #eef1f6, #e2e7ef) !important; }
html[data-skin="neo"] .sk-panel {
  background: #e8ecf3 !important;
  border: none !important;
  box-shadow: 12px 12px 28px rgba(163, 177, 198, .55), -12px -12px 28px rgba(255, 255, 255, .95) !important;
}
html[data-skin="neo"] .sk-surface {
  background: #e8ecf3 !important;
  border: none !important;
  box-shadow: 7px 7px 16px rgba(163, 177, 198, .5), -7px -7px 16px rgba(255, 255, 255, .95) !important;
}
html[data-skin="neo"] .sk-chip {
  border: none !important;
  box-shadow: inset 2px 2px 5px rgba(163, 177, 198, .45), inset -2px -2px 5px rgba(255, 255, 255, .85) !important;
}
html[data-skin="neo"] .sk-tint { box-shadow: inset 5px 5px 12px rgba(163, 177, 198, .35), inset -5px -5px 12px rgba(255, 255, 255, .8) !important; }
html[data-skin="neo"] .sk-field {
  background: #e8ecf3 !important;
  border: none !important;
  box-shadow: inset 5px 5px 11px rgba(163, 177, 198, .5), inset -5px -5px 11px rgba(255, 255, 255, .95) !important;
}
html[data-skin="neo"] .sk-btn {
  box-shadow: 5px 5px 12px rgba(163, 177, 198, .6), -5px -5px 12px rgba(255, 255, 255, .95) !important;
}
html[data-skin="neo"] .sk-btn:active { box-shadow: inset 4px 4px 10px rgba(163, 177, 198, .6), inset -4px -4px 10px rgba(255, 255, 255, .95) !important; }
html[data-skin="neo"] .sk-overlay { background: rgba(71, 85, 105, .3) !important; backdrop-filter: blur(4px); }

/* ============================================================
   6. LEGOMORPHISM — balok mainan, garis tebal, bayangan keras
   ============================================================ */
html[data-skin="lego"] body { background: #eaf1fb !important; }
html[data-skin="lego"] .sk-page {
  background:
    radial-gradient(circle at 7px 7px, rgba(20, 40, 77, .12) 3px, transparent 3.5px) 0 0 / 24px 24px,
    linear-gradient(160deg, #eef4ff, #dbe7fb) !important;
  background-attachment: fixed !important;
}
html[data-skin="lego"] .sk-panel {
  position: relative;
  background: #ffffff !important;
  border: 4px solid #14284d !important;
  box-shadow: 10px 10px 0 rgba(20, 40, 77, .85) !important;
}
html[data-skin="lego"] .sk-surface {
  background: #ffffff !important;
  border: 3px solid #1d3a6b !important;
  box-shadow: 6px 6px 0 rgba(29, 58, 107, .7) !important;
}
html[data-skin="lego"] .sk-chip {
  border: 2px solid rgba(20, 40, 77, .55) !important;
  box-shadow: 3px 3px 0 rgba(20, 40, 77, .35) !important;
}
html[data-skin="lego"] .sk-tint { border: 2px dashed rgba(20, 40, 77, .28) !important; }
html[data-skin="lego"] .sk-field {
  background: #fff !important;
  border: 3px solid #1d3a6b !important;
  box-shadow: inset 0 3px 0 rgba(20, 40, 77, .08) !important;
}
html[data-skin="lego"] .sk-btn {
  border: 3px solid rgba(20, 40, 77, .85) !important;
  box-shadow: 4px 4px 0 rgba(20, 40, 77, .8) !important;
}
html[data-skin="lego"] .sk-btn:active { transform: translate(3px, 3px); box-shadow: none !important; }
html[data-skin="lego"] .sk-overlay { background: rgba(20, 40, 77, .35) !important; backdrop-filter: blur(4px); }

/* ============================================================
   7. AURORA — gradien senja, kartu kaca lembut
   ============================================================ */
html[data-skin="aurora"] body { background: #eef0ff !important; }
html[data-skin="aurora"] .sk-page {
  background:
    radial-gradient(50% 40% at 0% 0%, rgba(167, 139, 250, .45), transparent 70%),
    radial-gradient(45% 40% at 100% 5%, rgba(240, 171, 252, .45), transparent 70%),
    radial-gradient(55% 45% at 50% 100%, rgba(103, 232, 249, .45), transparent 70%),
    linear-gradient(160deg, #eef0ff, #f7f0ff 50%, #eafcff) !important;
  background-attachment: fixed !important;
}
html[data-skin="aurora"] .sk-panel {
  background: linear-gradient(160deg, rgba(255, 255, 255, .84), rgba(255, 255, 255, .62)) !important;
  border: 1px solid rgba(255, 255, 255, .92) !important;
  box-shadow: 0 26px 60px -26px rgba(129, 140, 248, .65), inset 0 1px 0 #fff !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
html[data-skin="aurora"] .sk-surface {
  background: rgba(255, 255, 255, .74) !important;
  border: 1px solid rgba(255, 255, 255, .92) !important;
  box-shadow: 0 12px 28px -20px rgba(129, 140, 248, .8) !important;
}

  border: 1px solid rgba(255, 255, 255, .9) !important;
  box-shadow: 0 5px 12px -8px rgba(129, 140, 248, .9) !important;
}
html[data-skin="aurora"] .sk-tint { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6) !important; }
html[data-skin="aurora"] .sk-field {
  background: rgba(255, 255, 255, .8) !important;
  border: 1px solid rgba(255, 255, 255, .95) !important;
  box-shadow: inset 0 1px 0 #fff, 0 8px 18px -14px rgba(129, 140, 248, .9) !important;
}
html[data-skin="aurora"] .sk-btn {
  box-shadow: 0 12px 26px -16px rgba(129, 140, 248, .95), inset 0 1px 0 rgba(255, 255, 255, .6) !important;
}
html[data-skin="aurora"] .sk-overlay { background: rgba(76, 29, 149, .3) !important; backdrop-filter: blur(5px); }
html[data-skin="aurora"] .sk-banner { background: rgba(255, 255, 255, .76) !important; border: 1px solid rgba(255, 255, 255, .9) !important; }

/* ============================================================
   SKALA SUDUT (radius) per tema
   ============================================================ */
html[data-skin] .sk-pill { border-radius: 999px !important; }

html[data-skin="clay"] .sk-r-s { border-radius: 16px !important; }
html[data-skin="clay"] .sk-r-m { border-radius: 22px !important; }
html[data-skin="clay"] .sk-r-l { border-radius: 28px !important; }
html[data-skin="clay"] .sk-r-xl { border-radius: 36px !important; }

function JoinRoom({ onJoin, onAdminHub }) {
  const [tab, setTab] = useState("siswa");
  const [code, setCode] = useState("");
  const [adminPwd, setAdminPwd] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]"); } catch { return []; }
  });
  const [historyChecking, setHistoryChecking] = useState(true);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let local = [];
      try { local = JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]"); } catch { local = []; }
      if (!Array.isArray(local) || !local.length) {
        if (!cancelled) { setHistory([]); setHistoryChecking(false); }
        return;
      }
      const alive = [];
      await Promise.all(local.map(async (r) => {
        const code = String(r && r.code || "").trim().toUpperCase();
        if (!code) return;
        try {
          const snap = await db.ref(roomInfoPath(code)).once("value");
          const info = snap.val();
          if (info && typeof info === "object") {
            alive.push({
              code,
              name: String(info.name || r.name || code),
              lastAt: r.lastAt || Date.now()
            });
          }
        } catch {}
      }));
      alive.sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));
      const next = alive.slice(0, MAX_ROOM_HISTORY);
      try { localStorage.setItem("absensi_rooms_history", JSON.stringify(next)); } catch {}
      if (!cancelled) { setHistory(next); setHistoryChecking(false); }
    })();
    return () => { cancelled = true; };
  }, []);

  const saveHistory = (roomCode, roomName) => {
    try {
      const existing = JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]");
      const filtered = existing.filter(r => r.code !== roomCode);
      const next = [{ code: roomCode, name: roomName, lastAt: Date.now() }, ...filtered].slice(0, MAX_ROOM_HISTORY);
      localStorage.setItem("absensi_rooms_history", JSON.stringify(next));
      setHistory(next);
    } catch {}
  };

  const handleJoinAsSiswa = async (directCode) => {
    const c = (typeof directCode === "string" ? directCode : code).trim().toUpperCase();
    if (!c) return setError("Kode kelas tidak boleh kosong");
    if (!/^[A-Z0-9_-]{2,24}$/.test(c)) return setError("Format kode: huruf/angka/_/- (2-24)");
    setError(""); setLoading(true);
    try {
      const snap = await db.ref(roomInfoPath(c)).once("value");
      const info = snap.val();
      if (!info) { setLoading(false); return setError(`Kelas "${c}" tidak ditemukan.`); }
      saveHistory(c, info.name || c);
      onJoin(c, info.name || c, "siswa");
    } catch (err) { setError("Gagal cek kelas. Cek koneksi."); }
    setLoading(false);
  };

  const handleAdminHub = () => {
    const pwd = String(adminPwd || "").trim();
    if (!pwd) return setError("Password admin wajib diisi");
    if (pwd !== RESET_PASSWORD) return setError("Password admin salah");
    setError("");
    onAdminHub();
  };

  const cardStyle = { width: "100%", maxWidth: 500, borderRadius: 28, background: "#fff", boxShadow: "0 20px 60px -12px rgba(0,0,0,.35)", padding: 28, animation: "scaleIn .3s ease" };
  const inputStyle = { width: "100%", height: 52, padding: "0 16px", borderRadius: 14, border: "2px solid #e2e8f0", fontSize: 18, fontWeight: 800, letterSpacing: "0.1em", textAlign: "center", outline: "none", textTransform: "uppercase" };
  const btnPrimary = { width: "100%", height: 52, borderRadius: 14, border: "none", background: "#0f172a", color: "#fff", fontWeight: 800, fontSize: 15, cursor: loading ? "wait" : "pointer", opacity: loading ? 0.6 : 1 };

  return h("div", {
    style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg, #ecfeff 0%, #a5f3fc 100%)", padding: 16 }
  }, [
    h("div", { style: cardStyle }, [
      h("div", { style: { textAlign: "center", marginBottom: 20 } }, [
        h("div", { style: { width: 64, height: 64, borderRadius: 20, background: tab === "admin" ? "#0f172a" : "#0891b2", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 28, margin: "0 auto 12px" } }, tab === "admin" ? "🔒" : "📚"),
        h("div", { style: { fontSize: 22, fontWeight: 900, letterSpacing: "-0.02em" } }, "ABSENSI KEGIATAN"),
        h("div", { style: { fontSize: 12, fontWeight: 600, color: "#94a3b8", marginTop: 6, letterSpacing: "0.08em" } }, tab === "admin" ? "MODE ADMIN — TEMPLATE UMUM" : "MASUK DENGAN KODE KELAS")
      ]),

      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20, padding: 4, borderRadius: 14, background: "#f1f5f9" } }, [
        h("button", {
          type: "button",
          onClick: () => { setTab("siswa"); setError(""); },
          style: { height: 40, borderRadius: 10, border: "none", fontWeight: 800, fontSize: 13, cursor: "pointer", background: tab === "siswa" ? "#fff" : "transparent", color: tab === "siswa" ? "#0f172a" : "#64748b", boxShadow: tab === "siswa" ? "0 1px 3px rgba(0,0,0,.08)" : "none" }
        }, "👤 Siswa"),
        h("button", {
          type: "button",
          onClick: () => { setTab("admin"); setError(""); },
          style: { height: 40, borderRadius: 10, border: "none", fontWeight: 800, fontSize: 13, cursor: "pointer", background: tab === "admin" ? "#0f172a" : "transparent", color: tab === "admin" ? "#fff" : "#64748b", boxShadow: tab === "admin" ? "0 1px 3px rgba(0,0,0,.15)" : "none" }
        }, "🔒 Admin")
      ]),

      tab === "siswa" && h("div", null, [
        h("div", { style: { fontSize: 12, fontWeight: 700, color: "#94a3b8", marginBottom: 8, letterSpacing: "0.06em" } }, "KODE KELAS"),
        h("input", { type: "text", value: code, onChange: e => { setCode(e.target.value.toUpperCase()); setError(""); }, onKeyDown: e => { if (e.key === "Enter") handleJoinAsSiswa(); }, placeholder: "MISAL: JEPANG", autoFocus: true, style: inputStyle }),
        h("div", { style: { fontSize: 11, color: "#94a3b8", marginTop: 10, textAlign: "center", fontWeight: 600, lineHeight: 1.5 } }, "💡 Dapatkan kode kelas dari guru/pengajar kamu"),
        h("button", { onClick: handleJoinAsSiswa, disabled: loading, style: { ...btnPrimary, marginTop: 18, background: "#0891b2" } }, loading ? "Memuat..." : "Masuk Kelas →"),

        historyChecking && h("div", { style: { marginTop: 16, textAlign: "center", fontSize: 11, color: "#94a3b8", fontWeight: 600 } }, "Memeriksa kelas tersimpan…"),
        !historyChecking && history.length > 0 && h("div", { style: { marginTop: 22, paddingTop: 16, borderTop: "1px solid #f1f5f9" } }, [
          h("div", { style: { fontSize: 11, fontWeight: 800, color: "#94a3b8", marginBottom: 10, letterSpacing: "0.06em" } }, "KELAS YANG PERNAH DIBUKA"),
          ...history.map(r =>
            h("button", {
              key: r.code,
              onClick: () => handleJoinAsSiswa(r.code),
              style: { width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 12, border: "1px solid #e2e8f0", background: "#fff", cursor: "pointer", marginBottom: 6, textAlign: "left" }
            }, [
              h("span", { style: { width: 32, height: 32, borderRadius: 8, background: "#cffafe", color: "#0891b2", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 10, flexShrink: 0 } }, r.code.slice(0, 4)),
              h("div", { style: { flex: 1, minWidth: 0 } }, [
                h("div", { style: { fontSize: 13, fontWeight: 800, color: "#0f172a" } }, r.name || r.code),

              h("span", { style: { fontSize: 14, color: "#cbd5e1" } }, "→")
            ])
          )
        ])
      ]),

      tab === "admin" && h("div", null, [
        h("div", { style: { fontSize: 12, fontWeight: 700, color: "#94a3b8", marginBottom: 8, letterSpacing: "0.06em" } }, "PASSWORD ADMIN UTAMA"),

          onChange: e => { setAdminPwd(e.target.value); setError(""); },
          onKeyDown: e => { if (e.key === "Enter") handleAdminHub(); },

    ])
  ]);
}

            h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 } }, [
              h("button", { onClick: () => setImportPreview(null), style: { height: 40, borderRadius: 10, background: "#fff", border: "1px solid #e4e4e7", fontWeight: 700, fontSize: 12, cursor: "pointer", color: "#3f3f46" } }, "Batal"),
              h("button", { onClick: doImport, disabled: backupBusy, style: { height: 40, borderRadius: 10, background: "#16a34a", border: "none", color: "#fff", fontWeight: 800, fontSize: 12, cursor: backupBusy ? "wait" : "pointer", opacity: backupBusy ? 0.6 : 1 } }, backupBusy ? "Mengimport..." : "✓ Import Terpilih")
            ])
          ])
        ]),

        h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, position: "sticky", bottom: 0, background: "#fff", paddingTop: 10 } }, [
          h("button", { onClick: () => { setShowSettings(false); setImportPreview(null); }, style: { borderRadius:999, background:"#f4f4f5", border:"1px solid #e4e4e7", padding:"12px 16px", fontSize:13, fontWeight:700, cursor:"pointer" } }, "Batal"),
          h("button", { onClick: saveSettings, style: { borderRadius:999, background:"#0f172a", border:"none", color:"#fff", padding:"12px 16px", fontSize:13, fontWeight:700, cursor:"pointer" } }, "Simpan")
        ])
      ])
    ]),

    showRoomManage && h("div", { style: { position:"fixed", inset:0, zIndex:210, display:"flex", alignItems:"center", justifyContent:"center", padding:16 } }, [
      h("div", { onClick: () => { if (!roomManageBusy) { setShowRoomManage(false); setDeleteRoomStep(0); setDeleteRoomTyped(""); } }, style: { position:"absolute", inset:0, background:"rgba(0,0,0,.5)", backdropFilter:"blur(6px)" } }),
      h("div", { style: { position:"relative", width:"100%", maxWidth:420, maxHeight:"90vh", overflowY:"auto", borderRadius:24, background:"#fff", padding:24, boxShadow:"0 20px 60px -12px rgba(0,0,0,.4)", animation:"scaleIn .25s ease" } }, [
        h("button", { onClick: () => { if (!roomManageBusy) { setShowRoomManage(false); setDeleteRoomStep(0); setDeleteRoomTyped(""); } }, style: { position:"absolute", right:12, top:12, width:32, height:32, borderRadius:999, background:"#f4f4f5", border:"none", color:"#71717a", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 } }, "✕"),
        h("div", { style:{ fontSize:16, fontWeight:800, marginBottom:6, paddingRight: 30 } }, "🏫 Kelola Kelas"),
        h("div", { style:{ fontSize:12, color:"#64748b", marginBottom:18, lineHeight:1.45, fontWeight:600 } }, "Ganti nama atau hapus kelas ini secara permanen."),

        h("div", { style:{ fontSize:11, fontWeight:800, color:"#94a3b8", letterSpacing:"0.06em", marginBottom:6 } }, "KODE KELAS"),
        h("div", { style: { display:"flex", alignItems:"center", gap:8, marginBottom:16 } }, [
          h("div", { style: { flex:1, padding:"12px 14px", borderRadius:12, background:"#f8fafc", border:"1px solid #e2e8f0", fontSize:15, fontWeight:800, letterSpacing:"0.08em", color:"#0f172a" } }, roomCode),
          h("button", {
            onClick: () => { copyText(roomCode); toast("📋 Kode disalin: " + roomCode); },
            style: { height:44, padding:"0 14px", borderRadius:12, border:"1px solid #e2e8f0", background:"#fff", fontWeight:800, fontSize:12, cursor:"pointer", color:"#0f172a" }
          }, "Salin")
        ]),

        h("div", { style:{ fontSize:11, fontWeight:800, color:"#94a3b8", letterSpacing:"0.06em", marginBottom:6 } }, "NAMA KELAS"),
        h("div", { style: { display:"flex", gap:8, marginBottom:20 } }, [
          h("input", {
            type: "text", value: roomNameDraft,
            onChange: e => setRoomNameDraft(e.target.value),
            onKeyDown: e => { if (e.key === "Enter") saveRoomName(); },
            disabled: roomManageBusy,
            placeholder: "Nama tampilan kelas",
            style: { flex:1, height:44, padding:"0 14px", borderRadius:12, border:"1px solid #cbd5e1", fontSize:14, fontWeight:700, outline:"none" }
          }),
          h("button", {
            onClick: saveRoomName, disabled: roomManageBusy,
            style: { height:44, padding:"0 16px", borderRadius:12, border:"none", background:"#0f172a", color:"#fff", fontWeight:800, fontSize:13, cursor: roomManageBusy ? "wait" : "pointer", opacity: roomManageBusy ? 0.6 : 1 }
          }, "Simpan")
        ]),

        h("div", { style: { borderTop:"1px solid #f1f5f9", paddingTop:16 } }, [
          h("div", { style:{ fontSize:13, fontWeight:800, color:"#991b1b", marginBottom:6 } }, "🗑 Zona Berbahaya"),
          h("div", { style:{ fontSize:11, color:"#94a3b8", fontWeight:600, lineHeight:1.5, marginBottom:12 } },
            "Dua pilihan: hapus struktur saja (isi yang ada di JSON: pengaturan + siswa) atau hapus SEMUA termasuk data absensi di Firebase."),
          deleteRoomStep === 0 && h("div", { style: { display: "grid", gap: 8 } }, [
            h("button", {
              onClick: () => { setDeleteRoomMode("structure"); setDeleteRoomStep(1); setDeleteRoomTyped(""); },
              disabled: roomManageBusy,
              style: { width:"100%", height:44, borderRadius:12, border:"1px solid #fde68a", background:"#fffbeb", color:"#b45309", fontWeight:800, fontSize:13, cursor:"pointer" }
            }, "Hapus struktur (JSON / siswa / meta)"),
            h("button", {
              onClick: () => { setDeleteRoomMode("all"); setDeleteRoomStep(1); setDeleteRoomTyped(""); },
              disabled: roomManageBusy,
              style: { width:"100%", height:44, borderRadius:12, border:"1px solid rgba(239,68,68,.35)", background:"#fef2f2", color:"#b91c1c", fontWeight:800, fontSize:13, cursor:"pointer" }
            }, "Hapus semua (+ absensi Firebase)")
          ]),
          deleteRoomStep === 1 && h("div", { style: { background: deleteRoomMode === "all" ? "#fef2f2" : "#fffbeb", border: deleteRoomMode === "all" ? "1px solid #fecaca" : "1px solid #fde68a", borderRadius:14, padding:14 } }, [
            h("div", { style:{ fontSize:13, fontWeight:700, color: deleteRoomMode === "all" ? "#7f1d1d" : "#92400e", marginBottom:8, lineHeight:1.45 } },
              deleteRoomMode === "structure"
                ? ["Hapus struktur kelas ", h("strong", null, roomCode), "? Absensi harian di Firebase tetap ada."]
                : ["Hapus TOTAL kelas ", h("strong", null, roomCode), " termasuk SEMUA absensi Firebase?"]),
            h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 } }, [
              h("button", { onClick: () => setDeleteRoomStep(0), style: { height:40, borderRadius:10, background:"#fff", border:"1px solid #e4e4e7", fontWeight:700, fontSize:12, cursor:"pointer" } }, "Batal"),
              h("button", { onClick: () => setDeleteRoomStep(2), style: { height:40, borderRadius:10, background: deleteRoomMode === "all" ? "#ef4444" : "#d97706", border:"none", color:"#fff", fontWeight:800, fontSize:12, cursor:"pointer" } }, "Ya, lanjut")
            ])
          ]),
          deleteRoomStep === 2 && h("div", { style: { background: deleteRoomMode === "all" ? "#fef2f2" : "#fffbeb", border: deleteRoomMode === "all" ? "1px solid #fecaca" : "1px solid #fde68a", borderRadius:14, padding:14 } }, [
            h("div", { style:{ fontSize:12, fontWeight:700, color: deleteRoomMode === "all" ? "#7f1d1d" : "#92400e", marginBottom:8, lineHeight:1.45 } },
              ["Ketik kode kelas ", h("strong", null, roomCode), " untuk konfirmasi:"]),
            h("input", {
              type: "text", value: deleteRoomTyped,
              onChange: e => setDeleteRoomTyped(e.target.value.toUpperCase()),
              placeholder: roomCode,
              disabled: roomManageBusy,
              autoFocus: true,
              style: { width:"100%", height:42, padding:"0 12px", borderRadius:10, border:"1px solid #fca5a5", fontSize:14, fontWeight:800, letterSpacing:"0.08em", outline:"none", marginBottom:10, textAlign:"center" }
            }),
            h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 } }, [
              h("button", { onClick: () => { setDeleteRoomStep(0); setDeleteRoomTyped(""); }, disabled: roomManageBusy, style: { height:40, borderRadius:10, background:"#fff", border:"1px solid #e4e4e7", fontWeight:700, fontSize:12, cursor:"pointer" } }, "Batal"),
              h("button", {
                onClick: deleteRoomPermanently, disabled: roomManageBusy || deleteRoomTyped.trim().toUpperCase() !== roomCode,
                style: { height:40, borderRadius:10, background: deleteRoomTyped.trim().toUpperCase() === roomCode ? (deleteRoomMode === "all" ? "#dc2626" : "#d97706") : "#fca5a5", border:"none", color:"#fff", fontWeight:800, fontSize:12, cursor: roomManageBusy ? "wait" : "pointer", opacity: roomManageBusy ? 0.6 : 1 }
              }, roomManageBusy ? "Menghapus..." : (deleteRoomMode === "all" ? "Hapus Semua" : "Hapus Struktur"))
            ])
          ])
        ])
      ])
    ]),

    h(ThemeLauncher, { isAdmin }),
    h(Toast, { msg: toastMsg, visible: toastVisible })
  ]);
}

/* ===================== PEMILIH TEMA + ATUR SENDIRI (KHUSUS ADMIN) ===================== */
function ThemeLauncher({ isAdmin }) {
  const [open, setOpen] = useState(false);
  const [info, setInfo] = useState(() => SkinEngine.getState());
  const [q, setQ] = useState("");

  useEffect(() => SkinEngine.subscribe(setInfo), []);

  if (!isAdmin) return null;

  const cfg = info.cfg;
  const cu = info.custom || SkinEngine.DEFAULT_CUSTOM;
  const isDaily = cfg.mode === "daily";
  const isCustom = cfg.skin === "custom";
  const byId = id => SkinEngine.THEMES.filter(t => t.id === id)[0] || SkinEngine.THEMES[0];
  const todayTheme = byId(info.today);
  const tomorrowTheme = byId(info.tomorrow);
  const activeTheme = byId(cfg.skin);
  const needle = q.trim().toLowerCase();
  const setCu = patch => SkinEngine.updateCustom(patch);

  const card = t => {
    const active = t.id === cfg.skin && !isDaily;
    const isToday = isDaily && t.id === info.today;
    return h("button", {
      key: t.id,
      className: "sk-th" + (active ? " active" : ""),
      onClick: () => SkinEngine.update({ skin: t.id, mode: "fixed" }),
      title: t.name
    }, [
      h("span", { key: "s", className: "sk-th-swatch", style: { background: t.preview } }),
      h("span", { key: "m", className: "sk-th-meta" }, [
        h("span", { key: "n", className: "sk-th-name" }, t.name),
        h("span", { key: "d", className: "sk-th-desc" }, isToday ? "hari ini" : t.desc)
      ]),
      active && h("span", { key: "c", className: "sk-th-check" }, "✓"),
      !active && isToday && h("span", { key: "t", className: "sk-th-check" }, "★")
    ]);
  };

  const group = (label, items) => {
    const shown = needle ? items.filter(t => (t.name + " " + t.desc).toLowerCase().indexOf(needle) >= 0) : items;
    if (!shown.length) return null;
    return h("div", { key: label }, [
      h("div", { key: "l", className: "sk-admin-label", style: { marginTop: 12 } }, label + " · " + items.length),
      h("div", { key: "g", className: "sk-admin-grid" }, shown.map(card))
    ]);
  };

  /* ---------- kontrol atur sendiri ---------- */
  const colorRow = (label, key, value, k) => h("div", { key: "c-" + k, className: "sk-ctl-row" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("span", { key: "w", className: "sk-ctl-colors" }, [
      h("input", {
        key: "i", type: "color", className: "sk-color", value: value,
        onChange: e => setCu({ [key]: e.target.value })
      }),
      h("span", { key: "h", className: "sk-hex" }, String(value || "").toUpperCase())
    ])
  ]);

  const selectRow = (label, key, value, opts, k) => h("div", { key: "s-" + k, className: "sk-ctl" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("select", {
      key: "i", className: "sk-select", value: value,
      onChange: e => setCu({ [key]: e.target.value })
    }, opts.map(o => h("option", { key: o[0], value: o[0] }, o[1])))
  ]);

  const rangeRow = (label, key, value, min, max, step, suffix, k) => h("div", { key: "r-" + k, className: "sk-ctl" }, [
    h("div", { key: "h", className: "sk-ctl-row" }, [
      h("span", { key: "l", className: "sk-ctl-label" }, label),
      h("span", { key: "v", className: "sk-ctl-val" }, value + (suffix || ""))
    ]),
    h("input", {
      key: "i", type: "range", className: "sk-range", min: min, max: max, step: step, value: value,
      onChange: e => setCu({ [key]: Number(e.target.value) })
    })
  ]);

  const toggleRow = (label, key, value, k) => h("label", { key: "t-" + k, className: "sk-ctl-row sk-ctl-toggle" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("input", {
      key: "i", type: "checkbox", checked: !!value,
      onChange: e => setCu({ [key]: e.target.checked })
    })
  ]);

  const settings = isCustom && h("div", { key: "custom", className: "sk-settings" }, [
    h("div", { key: "l", className: "sk-admin-label" }, "PRESET CEPAT"),
    h("div", { key: "p", className: "sk-presets" }, SkinEngine.PRESETS.map(p =>
      h("button", { key: p.id, className: "sk-preset", onClick: () => setCu(p.values) }, p.name)
    )),

    h("div", { key: "l2", className: "sk-admin-label", style: { marginTop: 14 } }, "LATAR HALAMAN"),
    selectRow("Gaya latar", "bgStyle", cu.bgStyle, [
      ["solid", "Warna rata"], ["gradient", "Gradien"], ["grid", "Garis grid"], ["dots", "Titik-titik"], ["mesh", "Cahaya mesh"]
    ], "bgStyle"),
    colorRow("Warna latar", "bg", cu.bg, "bg"),
    colorRow("Warna kedua", "bg2", cu.bg2, "bg2"),

    h("div", { key: "l3", className: "sk-admin-label", style: { marginTop: 14 } }, "KARTU & GARIS"),
    colorRow("Warna kartu", "surface", cu.surface, "surface"),
    rangeRow("Transparansi kartu", "surfaceAlpha", Math.round((cu.surfaceAlpha || 1) * 100), 35, 100, 1, "%", "surfaceAlpha"),
    colorRow("Warna garis tepi", "border", cu.border, "border"),
    rangeRow("Tebal garis tepi", "borderWidth", cu.borderWidth, 0, 6, 1, "px", "borderWidth"),
    rangeRow("Sudut membulat", "radius", cu.radius, 0, 44, 1, "px", "radius"),
    selectRow("Jenis bayangan", "shadow", cu.shadow, [
      ["none", "Tanpa bayangan"], ["soft", "Lembut"], ["strong", "Tebal & dalam"],
      ["hard", "Kotak keras (lego)"], ["glow", "Menyala (neon)"], ["float", "3D timbul"]
    ], "shadow"),
    toggleRow("Efek kaca (blur)", "glass", cu.glass, "glass"),

    h("div", { key: "l4", className: "sk-admin-label", style: { marginTop: 14 } }, "TEKS"),
    colorRow("Warna teks", "text", cu.text, "text"),
    colorRow("Teks sekunder", "textDim", cu.textDim, "textDim"),
    selectRow("Jenis huruf", "font", cu.font, [
      ["system", "Biasa (system)"], ["rounded", "Membulat"], ["serif", "Serif"],
      ["mono", "Monospace"], ["narrow", "Ramping"]
    ], "font"),
    rangeRow("Ukuran tampilan", "zoom", cu.zoom, 85, 115, 1, "%", "zoom"),

    h("div", { key: "l5", className: "sk-admin-label", style: { marginTop: 14 } }, "TOMBOL & AKSEN"),
    colorRow("Warna aksen", "accent", cu.accent, "accent"),
    colorRow("Teks di aksen", "accentText", cu.accentText, "accentText"),
    selectRow("Warna tombol", "buttonStyle", cu.buttonStyle, [
      ["auto", "Warna asli aplikasi (HADIR hijau, dll)"], ["accent", "Semua tombol warna aksen"]
    ], "buttonStyle"),

    h("button", {
      key: "reset",
      className: "sk-preset sk-preset-reset",
      onClick: () => setCu(SkinEngine.DEFAULT_CUSTOM)
    }, "↺ Reset ke pengaturan awal")
  ]);

  const lights = SkinEngine.THEMES.filter(t => t.tone !== "dark");
  const darks = SkinEngine.THEMES.filter(t => t.tone === "dark");

  return h("div", null, [
    h("button", {
      key: "fab",
      className: "sk-admin-fab",
      onClick: () => setOpen(o => !o),
      title: "Pilih tema tampilan",
      "aria-label": "Pilih tema tampilan"
    }, open ? "✕" : "🎨"),

    open && h("div", { key: "panel", className: "sk-admin-panel" }, [
      h("div", { key: "head", className: "sk-admin-head" }, [
        h("div", null, [
          h("div", { className: "sk-admin-title" }, "🎨 Tema Tampilan"),
          h("div", { className: "sk-admin-sub" }, (SkinEngine.THEMES.length) + " tema · pilihan admin langsung diikuti semua siswa")
        ]),
        h("button", { className: "sk-admin-x", onClick: () => setOpen(false), title: "Tutup" }, "✕")
      ]),

      h("input", {
        key: "search",
        type: "text",
        value: q,
        onChange: e => setQ(e.target.value),
        placeholder: "Cari tema...",
        className: "sk-admin-search"
      }),

      group("TEMA TERANG", lights),
      group("TEMA GELAP", darks),

      h("div", { key: "mode", className: "sk-admin-sec" }, [
        h("div", { className: "sk-admin-label" }, "MODE TEMA"),
        h("div", { className: "sk-admin-modes" }, [
          h("button", {
            className: "sk-mode" + (!isDaily ? " active" : ""),
            onClick: () => SkinEngine.update({ mode: "fixed" })
          }, "📌 Manual"),
          h("button", {
            className: "sk-mode" + (isDaily ? " active" : ""),
            onClick: () => SkinEngine.update({ mode: "daily" })
          }, "🎲 Acak harian")
        ])
      ]),

      settings,

      h("div", { key: "note", className: "sk-admin-note" },
        isDaily
          ? [
              "Tema otomatis berganti tiap hari dari tanggal (WIB), jadi semua HP menampilkan tema yang sama.",
              h("br", { key: "b1" }),
              h("br", { key: "b2" }),
              "Hari ini: ",
              h("b", { key: "t" }, todayTheme.name),
              h("br", { key: "b3" }),
              "Besok: ",
              h("b", { key: "tm" }, tomorrowTheme.name)
            ]
          : isCustom
            ? [
                "Mode ", h("b", { key: "c" }, "Custom Bebas"), " aktif. Semua warna, bentuk dan bayangan di bawah ini ",
                "langsung tersimpan dan dipakai tampilan siswa."
              ]
            : [
                "Tema aktif: ",
                h("b", { key: "t" }, activeTheme.name),
                ". Tampilan siswa mengikuti otomatis begitu tersimpan."
              ]
      )
    ])
  ]);
}

/* ===== KONEKSI TEMA: admin menyimpan, siswa mengikuti ===== */
SkinEngine.connect(db, () => basePath() + "/ui_theme", "skin_template_v1");

ReactDOM.createRoot(document.getElementById("root")).render(h(AbsensiApp));
</script>
</body>
</html>
