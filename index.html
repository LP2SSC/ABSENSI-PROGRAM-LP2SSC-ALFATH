function normalizeProgramDays(raw) {
  if (Array.isArray(raw) && raw.length) {
    const set = new Set();
    raw.forEach(v => {
      const n = Number(v);
      if (!isNaN(n) && n >= 0 && n <= 6) set.add(n);
    });
    if (set.size) return Array.from(set).sort((a,b) => {
      const ord = x => x === 0 ? 7 : x;
      return ord(a) - ord(b);
    });
  }
  if (raw != null && typeof raw !== "object") {
    const n = Number(raw);
    if (!isNaN(n) && n >= 0 && n <= 6) return [n];
  }
  return [...ALL_DAYS];
}

function makeDefaultProgramConfig() { return { programs: [ { id: "P1", label: "Program 1", subs: [] } ] }; }
function normalizeSubs(rawSubs) {
  let arr = [];
  if (Array.isArray(rawSubs)) arr = rawSubs;
  else if (rawSubs && typeof rawSubs === "object") {
    arr = Object.keys(rawSubs).sort((a,b) => parseInt(a,10) - parseInt(b,10)).map(k => rawSubs[k]);
  }
  return arr.filter(s => s && typeof s === "object")
    .map(s => ({
      id: String(s.id || ""),

      emoji: Array.from(String(s.emoji || "")).slice(0, 4).join(""),
      days: normalizeProgramDays(s.days)
    }))
    .filter(s => s.id);
}
function normalizeProgramConfig(raw) {
  if (!raw || typeof raw !== "object") return makeDefaultProgramConfig();
  let rawPrograms = null;
  if (Array.isArray(raw.programs)) rawPrograms = raw.programs;
  else if (raw.programs && typeof raw.programs === "object") {
    rawPrograms = Object.keys(raw.programs).sort((a,b) => parseInt(a,10) - parseInt(b,10)).map(k => raw.programs[k]);
  }
  if (rawPrograms) {
    return { programs: rawPrograms.filter(p => p && typeof p === "object")
      .map(p => ({ id: String(p.id || ""), label: String(p.label || "").trim() || ("Program " + String(p.id || "1")), subs: normalizeSubs(p.subs) }))
      .filter(p => p.id) };
  }
  const legacyKeys = Object.keys(raw).filter(k => raw[k] && typeof raw[k] === "object" && raw[k].subs !== undefined);
  if (legacyKeys.length) {
    return { programs: legacyKeys.sort().map(k => ({ id: k, label: String(raw[k].label || "").trim() || ("Program " + k.slice(1)), subs: normalizeSubs(raw[k].subs) })) };
  }
  return makeDefaultProgramConfig();
}

/* ===================== DATE/TIME ===================== */
function scheduleToMin(v, fallbackMin) {
  if (typeof v === "string" && v.indexOf(":") !== -1) {
    const parts = v.split(":");
    const hh = parseInt(parts[0], 10), mm = parseInt(parts[1], 10);
    if (!isNaN(hh) && !isNaN(mm)) return Math.min(1439, Math.max(0, hh * 60 + mm));
  }
  const n = parseInt(v, 10);
  if (!isNaN(n)) return Math.min(1439, Math.max(0, n));
  return fallbackMin;
}
function fmtSchedule(min) {
  const m = Math.min(1439, Math.max(0, min | 0));
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function parseTimeInput(str) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || "").trim());
  if (!m) return null;
  const hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (hh > 23 || mm > 59) return null;
  return hh * 60 + mm;
}
function isTimeWithin(now, open, close) {
  if (open === close) return false;
  if (open < close) return now >= open && now < close;
  return now >= open || now < close;
}
function isTimePastClose(now, open, close) {
  if (open === close) return false;
  if (open < close) return now >= close;
  return now >= close && now < open;
}
function resolveScheduleForBatch(batchKey, subSchedules, autoOpenMin, autoResetMin, autoResetEnabled, dayOfWeek) {
  const s = subSchedules && subSchedules[batchKey];
  if (s && typeof s === "object") {
    // Mode per-hari
    if (s.mode === "perday" && s.byDay && dayOfWeek != null) {
      const d = s.byDay[String(dayOfWeek)];
      if (d && d.open != null && d.close != null) {
        const o = scheduleToMin(d.open, autoOpenMin);
        const c = scheduleToMin(d.close, autoResetMin);
        if (o === c) return { enabled: false, open: o, close: c, perSub: true, perDay: true };
        return { enabled: true, open: o, close: c, perSub: true, perDay: true };
      }
      return { enabled: false, open: autoOpenMin, close: autoResetMin, perSub: true, perDay: true };
    }
    // Mode sama tiap hari
    if (s.open != null && s.close != null) {
      const o = scheduleToMin(s.open, autoOpenMin);
      const c = scheduleToMin(s.close, autoResetMin);
      if (o === c) return { enabled: false, open: o, close: c, perSub: true };
      return { enabled: true, open: o, close: c, perSub: true };
    }
  }
  return { enabled: !!autoResetEnabled, open: autoOpenMin, close: autoResetMin, perSub: false };
}
function formatDateID(d) {
  const hari = new Intl.DateTimeFormat("id-ID",{weekday:"long"}).format(d).toUpperCase();
  const tgl  = new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"long",year:"numeric"}).format(d);
  return `${hari}, ${tgl}`;
}
function formatDateAbsensi(d) {
  const hari = new Intl.DateTimeFormat("id-ID", { weekday: "long" }).format(d);
  const tgl = new Intl.DateTimeFormat("id-ID", { day: "2-digit", month: "long", year: "numeric" }).format(d);
  return `${hari.charAt(0).toUpperCase() + hari.slice(1)}, ${tgl}`;
}
function wibToday() {
  const w = getWibParts();
  const [y, m, d] = w.dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function wibTodayStr() {
  return getWibParts().dateStr;
}
function toInputDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function getWibParts(d = new Date()) {
  const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
  const parts = Object.fromEntries(fmt.formatToParts(d).filter(p => p.type !== "literal").map(p => [p.type, p.value]));
  const hour = parseInt(parts.hour, 10) % 24;
  return { dateStr: `${parts.year}-${parts.month}-${parts.day}`, hour, minute: parseInt(parts.minute,10), second: parseInt(parts.second,10) };
}
function getWibNowSeconds() {
  const w = getWibParts();
  return w.hour * 3600 + w.minute * 60 + w.second;
}
function formatCountdown(secs) {
  const s = Math.max(0, secs | 0);
  const hh = Math.floor(s / 3600);
  const mm = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}
function secondsUntilClose(open, close) {
  const now = getWibNowSeconds();
  const openSec = open * 60;
  const closeSec = close * 60;
  if (open === close) return 0;
  if (open < close) {
    if (now >= closeSec) return 0;
    if (now < openSec) return 0;
    return closeSec - now;
  }
  // overnight
  if (now >= openSec) return (closeSec + 86400) - now;
  if (now < closeSec) return closeSec - now;
  return 0;
}
function playBeep(freq = 880, durMs = 90) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = window.__beepCtx || new Ctx();
    window.__beepCtx = ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durMs / 1000);
    o.start(t); o.stop(t + durMs / 1000 + 0.02);
  } catch {}
}
function dateOffsetStr(d, offsetDays) { return toInputDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + offsetDays)); }
function last7DateStrs(d) { const arr = []; for (let i = 6; i >= 0; i--) arr.push(dateOffsetStr(d, -i)); return arr; }
function weekRangesInMonth(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const ranges = [];
  const bounds = [[1,7],[8,14],[15,21],[22,daysInMonth]];
  bounds.forEach((b, idx) => {
    if (b[0] > daysInMonth) return;
    const end = Math.min(b[1], daysInMonth);
    const s = `${year}-${String(month+1).padStart(2,"0")}-${String(b[0]).padStart(2,"0")}`;
    const e = `${year}-${String(month+1).padStart(2,"0")}-${String(end).padStart(2,"0")}`;
    ranges.push({ week: idx + 1, start: s, end: e });
  });
  return ranges;
}
function eachDateStr(startStr, endStr) {
  const out = [];
  const [ys,ms,ds] = startStr.split("-").map(Number);
  const [ye,me,de] = endStr.split("-").map(Number);
  let cur = new Date(ys, ms-1, ds);
  const end = new Date(ye, me-1, de);
  while (cur <= end) { out.push(toInputDate(cur)); cur.setDate(cur.getDate() + 1); }
  return out;
}

async function copyText(text) {
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; } } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
  } catch { return false; }
}
function downloadJson(obj, filename) {
  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  } catch { return false; }
}
function toFbKey(name) {
  return String(name).replace(/\\/g,"\\x5c").replace(/\./g,"\\x2e").replace(/#/g,"\\x23").replace(/\$/g,"\\x24").replace(/\[/g,"\\x5b").replace(/\]/g,"\\x5d").replace(/\//g,"\\x2f");
}
function fromFbKey(key) {
  return String(key).replace(/\\x2e/g,".").replace(/\\x23/g,"#").replace(/\\x24/g,"$").replace(/\\x5b/g,"[").replace(/\\x5d/g,"]").replace(/\\x2f/g,"/").replace(/\\x5c/g,"\\");
}

}

/* ===================== JOIN SCREEN (Siswa + Admin Hub) ===================== */
function JoinRoom({ onJoin, onAdminHub }) {
  const [tab, setTab] = useState("siswa");
  const [code, setCode] = useState("");
  const [adminPwd, setAdminPwd] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]"); } catch { return []; }
  });
  const [historyChecking, setHistoryChecking] = useState(true);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let local = [];
      try { local = JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]"); } catch { local = []; }
      if (!Array.isArray(local) || !local.length) {
        if (!cancelled) { setHistory([]); setHistoryChecking(false); }
        return;
      }
      const alive = [];
      await Promise.all(local.map(async (r) => {
        const code = String(r && r.code || "").trim().toUpperCase();
        if (!code) return;
        try {
          const snap = await db.ref(roomInfoPath(code)).once("value");
          const info = snap.val();
          if (info && typeof info === "object") {
            alive.push({
              code,
              name: String(info.name || r.name || code),
              lastAt: r.lastAt || Date.now()
            });
          }
        } catch {}
      }));
      alive.sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));
      const next = alive.slice(0, MAX_ROOM_HISTORY);
      try { localStorage.setItem("absensi_rooms_history", JSON.stringify(next)); } catch {}
      if (!cancelled) { setHistory(next); setHistoryChecking(false); }
    })();
    return () => { cancelled = true; };
  }, []);

  const saveHistory = (roomCode, roomName) => {
    try {
      const existing = JSON.parse(localStorage.getItem("absensi_rooms_history") || "[]");
      const filtered = existing.filter(r => r.code !== roomCode);
      const next = [{ code: roomCode, name: roomName, lastAt: Date.now() }, ...filtered].slice(0, MAX_ROOM_HISTORY);
      localStorage.setItem("absensi_rooms_history", JSON.stringify(next));
      setHistory(next);
    } catch {}
  };

  const handleJoinAsSiswa = async (directCode) => {
    const c = (typeof directCode === "string" ? directCode : code).trim().toUpperCase();
    if (!c) return setError("Kode kelas tidak boleh kosong");
    if (!/^[A-Z0-9_-]{2,24}$/.test(c)) return setError("Format kode: huruf/angka/_/- (2-24)");
    setError(""); setLoading(true);
    try {
      const snap = await db.ref(roomInfoPath(c)).once("value");
      const info = snap.val();
      if (!info) { setLoading(false); return setError(`Kelas "${c}" tidak ditemukan.`); }
      saveHistory(c, info.name || c);
      onJoin(c, info.name || c, "siswa");
    } catch (err) { setError("Gagal cek kelas. Cek koneksi."); }
    setLoading(false);
  };

  const handleAdminHub = () => {
    const pwd = String(adminPwd || "").trim();
    if (!pwd) return setError("Password admin wajib diisi");
    if (pwd !== RESET_PASSWORD) return setError("Password admin salah");
    setError("");
    onAdminHub();
  };

  const cardStyle = { width: "100%", maxWidth: 500, borderRadius: 28, background: "#fff", boxShadow: "0 20px 60px -12px rgba(0,0,0,.35)", padding: 28, animation: "scaleIn .3s ease" };
  const inputStyle = { width: "100%", height: 52, padding: "0 16px", borderRadius: 14, border: "2px solid #e2e8f0", fontSize: 18, fontWeight: 800, letterSpacing: "0.1em", textAlign: "center", outline: "none", textTransform: "uppercase" };
  const btnPrimary = { width: "100%", height: 52, borderRadius: 14, border: "none", background: "#0f172a", color: "#fff", fontWeight: 800, fontSize: 15, cursor: loading ? "wait" : "pointer", opacity: loading ? 0.6 : 1 };

  return h("div", {
    style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg, #ecfeff 0%, #a5f3fc 100%)", padding: 16 }
  }, [
    h("div", { style: cardStyle }, [
      h("div", { style: { textAlign: "center", marginBottom: 20 } }, [
        h("div", { style: { width: 64, height: 64, borderRadius: 20, background: tab === "admin" ? "#0f172a" : "#0891b2", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 28, margin: "0 auto 12px" } }, tab === "admin" ? "🔒" : "📚"),
        h("div", { style: { fontSize: 22, fontWeight: 900, letterSpacing: "-0.02em" } }, "ABSENSI KEGIATAN"),
        h("div", { style: { fontSize: 12, fontWeight: 600, color: "#94a3b8", marginTop: 6, letterSpacing: "0.08em" } }, tab === "admin" ? "MODE ADMIN — TEMPLATE UMUM" : "MASUK DENGAN KODE KELAS")
      ]),

      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20, padding: 4, borderRadius: 14, background: "#f1f5f9" } }, [
        h("button", {
          type: "button",
          onClick: () => { setTab("siswa"); setError(""); },
          style: { height: 40, borderRadius: 10, border: "none", fontWeight: 800, fontSize: 13, cursor: "pointer", background: tab === "siswa" ? "#fff" : "transparent", color: tab === "siswa" ? "#0f172a" : "#64748b", boxShadow: tab === "siswa" ? "0 1px 3px rgba(0,0,0,.08)" : "none" }
        }, "👤 Siswa"),
        h("button", {
          type: "button",
          onClick: () => { setTab("admin"); setError(""); },
          style: { height: 40, borderRadius: 10, border: "none", fontWeight: 800, fontSize: 13, cursor: "pointer", background: tab === "admin" ? "#0f172a" : "transparent", color: tab === "admin" ? "#fff" : "#64748b", boxShadow: tab === "admin" ? "0 1px 3px rgba(0,0,0,.15)" : "none" }
        }, "🔒 Admin")
      ]),

      tab === "siswa" && h("div", null, [
        h("div", { style: { fontSize: 12, fontWeight: 700, color: "#94a3b8", marginBottom: 8, letterSpacing: "0.06em" } }, "KODE KELAS"),
        h("input", { type: "text", value: code, onChange: e => { setCode(e.target.value.toUpperCase()); setError(""); }, onKeyDown: e => { if (e.key === "Enter") handleJoinAsSiswa(); }, placeholder: "MISAL: JEPANG", autoFocus: true, style: inputStyle }),
        h("div", { style: { fontSize: 11, color: "#94a3b8", marginTop: 10, textAlign: "center", fontWeight: 600, lineHeight: 1.5 } }, "💡 Dapatkan kode kelas dari guru/pengajar kamu"),
        h("button", { onClick: handleJoinAsSiswa, disabled: loading, style: { ...btnPrimary, marginTop: 18, background: "#0891b2" } }, loading ? "Memuat..." : "Masuk Kelas →"),

        historyChecking && h("div", { style: { marginTop: 16, textAlign: "center", fontSize: 11, color: "#94a3b8", fontWeight: 600 } }, "Memeriksa kelas tersimpan…"),
        !historyChecking && history.length > 0 && h("div", { style: { marginTop: 22, paddingTop: 16, borderTop: "1px solid #f1f5f9" } }, [
          h("div", { style: { fontSize: 11, fontWeight: 800, color: "#94a3b8", marginBottom: 10, letterSpacing: "0.06em" } }, "KELAS YANG PERNAH DIBUKA"),
          ...history.map(r =>
            h("button", {
              key: r.code,
              onClick: () => handleJoinAsSiswa(r.code),
              style: { width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 12, border: "1px solid #e2e8f0", background: "#fff", cursor: "pointer", marginBottom: 6, textAlign: "left" }
            }, [
              h("span", { style: { width: 32, height: 32, borderRadius: 8, background: "#cffafe", color: "#0891b2", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 10, flexShrink: 0 } }, r.code.slice(0, 4)),
              h("div", { style: { flex: 1, minWidth: 0 } }, [
                h("div", { style: { fontSize: 13, fontWeight: 800, color: "#0f172a" } }, r.name || r.code),
                h("div", { style: { fontSize: 11, color: "#94a3b8", fontWeight: 600 } }, "Kode: " + r.code)
              ]),
              h("span", { style: { fontSize: 14, color: "#cbd5e1" } }, "→")
            ])
          )
        ])
      ]),

      tab === "admin" && h("div", null, [
        h("div", { style: { fontSize: 12, fontWeight: 700, color: "#94a3b8", marginBottom: 8, letterSpacing: "0.06em" } }, "PASSWORD ADMIN UTAMA"),
        h("input", {
          type: "password", value: adminPwd,
          onChange: e => { setAdminPwd(e.target.value); setError(""); },
          onKeyDown: e => { if (e.key === "Enter") handleAdminHub(); },
          placeholder: "Password admin…",
          autoFocus: true,
          style: { ...inputStyle, textTransform: "none", letterSpacing: "0.05em", fontSize: 15 }
        }),
        h("div", { style: { fontSize: 11, color: "#94a3b8", marginTop: 10, textAlign: "center", fontWeight: 600, lineHeight: 1.5 } },
          "Masuk ke panel umum: buat kelas, import/export, kelola semua kelas — tanpa masuk kelas spesifik."),
        h("button", { onClick: handleAdminHub, disabled: loading, style: { ...btnPrimary, marginTop: 18, background: "#0f172a" } }, "Masuk Panel Admin →")
      ]),

      error && h("div", { style: { marginTop: 14, padding: "12px 14px", borderRadius: 12, background: "#fef2f2", border: "1px solid #fecaca", color: "#991b1b", fontSize: 13, fontWeight: 700, textAlign: "center" } }, "⚠️ " + error),

      h("div", { style: { marginTop: 20, textAlign: "center", fontSize: 10, color: "#cbd5e1", fontWeight: 600, letterSpacing: "0.08em" } }, "ABSENSI LP2SSC • KEGIATAN KHUSUS")
    ])
  ]);
}

            style: { height:44, padding:"0 16px", borderRadius:12, border:"none", background:"#0f172a", color:"#fff", fontWeight:800, fontSize:13, cursor: roomManageBusy ? "wait" : "pointer", opacity: roomManageBusy ? 0.6 : 1 }
          }, "Simpan")
        ]),

        h("div", { style: { borderTop:"1px solid #f1f5f9", paddingTop:16 } }, [
          h("div", { style:{ fontSize:13, fontWeight:800, color:"#991b1b", marginBottom:6 } }, "🗑 Zona Berbahaya"),
          h("div", { style:{ fontSize:11, color:"#94a3b8", fontWeight:600, lineHeight:1.5, marginBottom:12 } },
            "Dua pilihan: hapus struktur saja (isi yang ada di JSON: pengaturan + siswa) atau hapus SEMUA termasuk data absensi di Firebase."),
          deleteRoomStep === 0 && h("div", { style: { display: "grid", gap: 8 } }, [
            h("button", {
              onClick: () => { setDeleteRoomMode("structure"); setDeleteRoomStep(1); setDeleteRoomTyped(""); },
              disabled: roomManageBusy,
              style: { width:"100%", height:44, borderRadius:12, border:"1px solid #fde68a", background:"#fffbeb", color:"#b45309", fontWeight:800, fontSize:13, cursor:"pointer" }
            }, "Hapus struktur (JSON / siswa / meta)"),
            h("button", {
              onClick: () => { setDeleteRoomMode("all"); setDeleteRoomStep(1); setDeleteRoomTyped(""); },
              disabled: roomManageBusy,
              style: { width:"100%", height:44, borderRadius:12, border:"1px solid rgba(239,68,68,.35)", background:"#fef2f2", color:"#b91c1c", fontWeight:800, fontSize:13, cursor:"pointer" }
            }, "Hapus semua (+ absensi Firebase)")
          ]),
          deleteRoomStep === 1 && h("div", { style: { background: deleteRoomMode === "all" ? "#fef2f2" : "#fffbeb", border: deleteRoomMode === "all" ? "1px solid #fecaca" : "1px solid #fde68a", borderRadius:14, padding:14 } }, [
            h("div", { style:{ fontSize:13, fontWeight:700, color: deleteRoomMode === "all" ? "#7f1d1d" : "#92400e", marginBottom:8, lineHeight:1.45 } },
              deleteRoomMode === "structure"
                ? ["Hapus struktur kelas ", h("strong", null, roomCode), "? Absensi harian di Firebase tetap ada."]
                : ["Hapus TOTAL kelas ", h("strong", null, roomCode), " termasuk SEMUA absensi Firebase?"]),
            h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 } }, [
              h("button", { onClick: () => setDeleteRoomStep(0), style: { height:40, borderRadius:10, background:"#fff", border:"1px solid #e4e4e7", fontWeight:700, fontSize:12, cursor:"pointer" } }, "Batal"),
              h("button", { onClick: () => setDeleteRoomStep(2), style: { height:40, borderRadius:10, background: deleteRoomMode === "all" ? "#ef4444" : "#d97706", border:"none", color:"#fff", fontWeight:800, fontSize:12, cursor:"pointer" } }, "Ya, lanjut")
            ])
          ]),
          deleteRoomStep === 2 && h("div", { style: { background: deleteRoomMode === "all" ? "#fef2f2" : "#fffbeb", border: deleteRoomMode === "all" ? "1px solid #fecaca" : "1px solid #fde68a", borderRadius:14, padding:14 } }, [
            h("div", { style:{ fontSize:12, fontWeight:700, color: deleteRoomMode === "all" ? "#7f1d1d" : "#92400e", marginBottom:8, lineHeight:1.45 } },
              ["Ketik kode kelas ", h("strong", null, roomCode), " untuk konfirmasi:"]),
            h("input", {
              type: "text", value: deleteRoomTyped,
              onChange: e => setDeleteRoomTyped(e.target.value.toUpperCase()),
              placeholder: roomCode,
              disabled: roomManageBusy,
              autoFocus: true,
              style: { width:"100%", height:42, padding:"0 12px", borderRadius:10, border:"1px solid #fca5a5", fontSize:14, fontWeight:800, letterSpacing:"0.08em", outline:"none", marginBottom:10, textAlign:"center" }
            }),
            h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 } }, [
              h("button", { onClick: () => { setDeleteRoomStep(0); setDeleteRoomTyped(""); }, disabled: roomManageBusy, style: { height:40, borderRadius:10, background:"#fff", border:"1px solid #e4e4e7", fontWeight:700, fontSize:12, cursor:"pointer" } }, "Batal"),
              h("button", {
                onClick: deleteRoomPermanently, disabled: roomManageBusy || deleteRoomTyped.trim().toUpperCase() !== roomCode,
                style: { height:40, borderRadius:10, background: deleteRoomTyped.trim().toUpperCase() === roomCode ? (deleteRoomMode === "all" ? "#dc2626" : "#d97706") : "#fca5a5", border:"none", color:"#fff", fontWeight:800, fontSize:12, cursor: roomManageBusy ? "wait" : "pointer", opacity: roomManageBusy ? 0.6 : 1 }
              }, roomManageBusy ? "Menghapus..." : (deleteRoomMode === "all" ? "Hapus Semua" : "Hapus Struktur"))
            ])
          ])
        ])
      ])
    ]),

    h(Toast, { msg: toastMsg, visible: toastVisible })
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(AbsensiApp));
</script>
</body>
</html>
